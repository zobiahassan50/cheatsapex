# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
name = "cheatsapex-com"
compatibility_date = "2025-10-11"

[assets]
directory = "./dist"
not_found_handling = "404-page"
# Match Astro trailingSlash: 'always' — avoid auto slash flips that stack with _redirects (ERR_TOO_MANY_REDIRECTS).
html_handling = "force-trailing-slash"
